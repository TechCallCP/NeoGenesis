plugins {
    id 'maven-publish'
    id 'net.neoforged.moddev' version '1.0.21'
}

configurations {
    clientOnlyMods {
        attributes {
            attribute(
                    Attribute.of("net.neoforged.moddevgradle.legacy.minecraft_mappings.v2", Named),
                    objects.named(Named, "named")
            )
        }
    }
}

group = project.maven_group
version = project.mod_version

base {
    archivesName = project.archives_name
}

// Replaced legacyForge with neoForge block for ModDevGradle
neoForge {
    version = project.neoforge_version

    runs {
        client {
            client()
        }
        data {
            data()
        }
        server {
            server()
        }
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', 'neogenesis'
        }
    }

    mods {
        neogenesis {
            sourceSet sourceSets.main
        }
    }
}

jar {
    manifest.attributes([
            "MixinConfigs": "neogenesis.mixins.json"
    ])
}

repositories {
    flatDir { dir 'libs'}

    maven {
        name = "ParchmentMC"
        url = "https://maven.parchmentmc.org"
    }

    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
    }

    exclusiveContent {
        forRepository {
            maven {
                name = "RyanHCode Maven"
                url = 'https://maven.ryanhcode.dev/releases'
            }
        }
        filter {
            // Fixed typo: added 'h' to dev.ryanhcode
            includeGroup("dev.ryanhcode.sable")
            includeGroup("dev.ryanhcode.sable-companion")
        }
    }

    maven {
        name = "Jared's maven"
        url = "https://maven.blamejared.com/"
    }

    maven {
        name 'Curios maven'
        url = "https://maven.theillusivec4.top/"
    }

    maven { url = "https://maven.ithundxr.dev/mirror" }
    maven { url = "https://maven.bawnorton.com/releases" }
    maven { url = "https://maven.enjarai.dev/mirrors" }

    mavenCentral()
}

dependencies {
    annotationProcessor("org.spongepowered:mixin:0.8.5:processor")

    // Registrate for NeoForge
    implementation("com.tterrag.registrate:Registrate:${registrate_version}")
    jarJar("com.tterrag.registrate:Registrate:${registrate_version}") {
        version {
            strictly "[${registrate_version},)"
            prefer "${registrate_version}"
        }
    }

    // MixinExtras & MixinSquared
    implementation(annotationProcessor("io.github.llamalad7:mixinextras-common:0.5.0"))
    implementation("io.github.llamalad7:mixinextras-neoforge:0.5.0")

    compileOnly(annotationProcessor("com.github.bawnorton.mixinsquared:mixinsquared-common:0.3.6-beta.1"))
    implementation("com.github.bawnorton.mixinsquared:mixinsquared-neoforge:0.3.6-beta.1")
    jarJar("com.github.bawnorton.mixinsquared:mixinsquared-neoforge:0.3.6-beta.1") {
        version {
            strictly "[0.3.6-beta.1,)"
            prefer "0.3.6-beta.1"
        }
    }

    // region Sable Physics Engine
    implementation("dev.ryanhcode.sable:sable-common-1.21.1:${sable_version}")
    implementation("dev.ryanhcode.sable:sable-neoforge-1.21.1:${sable_version}")
    // endregion

    // 1.21.1 NeoForge Mod Dependencies
    implementation("maven.modrinth:curios:9.0.10+1.21.1-neoforge")
    implementation("maven.modrinth:pehkui:3.8.3+1.21.1-neoforge")
    jarJar("maven.modrinth:pehkui:3.8.3+1.21.1-neoforge")

    additionalRuntimeClasspath("org.maplibre:earcut4j:3.0.0")
    implementation("org.maplibre:earcut4j:3.0.0")
    jarJar("org.maplibre:earcut4j:3.0.0") {
        version {
            strictly "[3.0.0,)"
            prefer "3.0.0"
        }
    }

    // Dev / Runtime mods
    runtimeOnly("maven.modrinth:spark:1.10.109-neoforge")
    runtimeOnly("mezz.jei:jei-1.21.1-neoforge:19.21.0.247")

    // Test dependencies
    testImplementation("org.junit.jupiter:junit-jupiter-api:5.10.0")
    testRuntimeOnly("org.junit.jupiter:junit-jupiter-engine:5.10.0")
}

afterEvaluate {
    tasks.named('runClient') {
        classpath += configurations.clientOnlyMods.incoming.files
    }
}

test {
    useJUnitPlatform()
}

processResources {
    inputs.property 'version', project.version

    // Target neoforge.mods.toml instead of legacy mods.toml
    filesMatching('META-INF/neoforge.mods.toml') {
        expand version: project.version
    }
}

java {
    withSourcesJar()

    // Upgraded Java toolchain to Java 21 for MC 1.21.1
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

sourceSets {
    test {
        compileClasspath += sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.runtimeClasspath
    }
}